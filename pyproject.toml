[project]
name = "voxtype"
version = "0.1.4"
description = "輕量語音輸入工具：快捷鍵錄音 → STT → LLM 整理 → 貼到游標位置"
readme = "README.md"
authors = [
    { name = "JSYEH", email = "juishuyeh@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "keyring>=25.7.0",
    "pillow>=12.3.0",
    "pynput>=1.8.2",
    "pyperclip>=1.11.0",
    "pystray>=0.19.5",
    "sounddevice>=0.5.6",
    "tomli-w>=1.2.0",
]

[project.scripts]
voxtype = "voxtype:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
]
