name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: VoxType-macOS-arm64
          - os: windows-latest
            name: VoxType-Windows-x64
    runs-on: ${{ matrix.os }}
    env:
      # runner 上的 Homebrew python@3.14 不含 tkinter，會打出「點設定沒反應」的包，
      # 所以強制用 uv 自己下載的 CPython（python-build-standalone，內含 Tcl/Tk）。
      UV_PYTHON_PREFERENCE: only-managed
      # 固定的自簽憑證：讓每次改版的 designated requirement 保持一致，
      # 使用者授權過的「輔助使用」與 Keychain 才不會每次更新就失效。
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: 安裝 uv (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: 安裝 uv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://astral.sh/uv/install.ps1 | iex
          "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: 安裝相依（uv 會自動抓 Python 3.14）
        run: uv sync

      - name: 確認建置用的 Python 有 tkinter
        run: uv run python -c "import sys, tkinter; print(sys.executable); print('Tk', tkinter.TkVersion)"

      - name: 打包
        run: uv run pyinstaller voxtype.spec --noconfirm

      - name: 驗證產物真的含 tkinter（macOS）
        if: runner.os == 'macOS'
        run: |
          find dist/VoxType.app -name "_tkinter*" | grep -q . \
            && echo "tkinter OK" \
            || { echo "::error::打包產物缺少 _tkinter，設定視窗會開不起來"; exit 1; }

      - name: 驗證產物真的含 tkinter（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path dist/VoxType/_internal/_tkinter.pyd)) {
            Write-Error "打包產物缺少 _tkinter.pyd，設定視窗會開不起來"; exit 1
          }
          Write-Output "tkinter OK"

      - name: 匯入簽章憑證（沒有 secret 就跳過，維持 PyInstaller 的 ad-hoc 簽章）
        if: runner.os == 'macOS' && env.MACOS_CERT_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/voxtype-signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: 用固定憑證簽章
        if: runner.os == 'macOS' && env.MACOS_CERT_P12 != ''
        run: |
          codesign --force --deep --sign "VoxType Self Signed" \
            --keychain "$SIGNING_KEYCHAIN" dist/VoxType.app
          codesign --verify --deep --strict dist/VoxType.app
          echo "--- designated requirement（每版都必須一樣，權限才不會失效）---"
          codesign -d -r- dist/VoxType.app 2>&1 | tail -1

      - name: 壓縮 .app（用 ditto 保留簽章與權限，不要用 zip）
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/VoxType.app ${{ matrix.name }}.zip

      - name: 壓縮 .exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/VoxType -DestinationPath ${{ matrix.name }}.zip

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: 建立 Release 並附上兩個安裝檔
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "VoxType $GITHUB_REF_NAME" \
            --generate-notes
