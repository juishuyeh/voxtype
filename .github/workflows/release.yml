name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: VoxType-macOS-arm64
          - os: windows-latest
            name: VoxType-Windows-x64
    runs-on: ${{ matrix.os }}
    env:
      # runner 上的 Homebrew python@3.14 不含 tkinter，會打出「點設定沒反應」的包，
      # 所以強制用 uv 自己下載的 CPython（python-build-standalone，內含 Tcl/Tk）。
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v7

      - name: 安裝 uv (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: 安裝 uv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://astral.sh/uv/install.ps1 | iex
          "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: 安裝相依（uv 會自動抓 Python 3.14）
        run: uv sync

      - name: 確認建置用的 Python 有 tkinter
        run: uv run python -c "import sys, tkinter; print(sys.executable); print('Tk', tkinter.TkVersion)"

      - name: 打包
        run: uv run pyinstaller voxtype.spec --noconfirm

      - name: 驗證產物真的含 tkinter（macOS）
        if: runner.os == 'macOS'
        run: |
          find dist/VoxType.app -name "_tkinter*" | grep -q . \
            && echo "tkinter OK" \
            || { echo "::error::打包產物缺少 _tkinter，設定視窗會開不起來"; exit 1; }

      - name: 驗證產物真的含 tkinter（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path dist/VoxType/_internal/_tkinter.pyd)) {
            Write-Error "打包產物缺少 _tkinter.pyd，設定視窗會開不起來"; exit 1
          }
          Write-Output "tkinter OK"

      - name: 壓縮 .app（用 ditto 保留簽章與權限，不要用 zip）
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/VoxType.app ${{ matrix.name }}.zip

      - name: 壓縮 .exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/VoxType -DestinationPath ${{ matrix.name }}.zip

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: 建立 Release 並附上兩個安裝檔
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "VoxType $GITHUB_REF_NAME" \
            --generate-notes
